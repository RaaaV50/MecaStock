<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MecaStock — Gerenciamento de Inventário para Mecânicas</title>
  <meta name="description" content="Sistema profissional de gerenciamento de inventário para oficinas mecânicas. Controle de peças, estoque e veículos compatíveis." />
  <meta name="keywords" content="inventário mecânica, estoque peças, controle oficina, gerenciamento mecânico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="main-header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebar-toggle" onclick="alternarBarraLateral()" title="Menu">
        <span></span><span></span><span></span>
      </button>
      <a class="logo" onclick="navegarPara('dashboard')" href="#">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <span class="logo-text">Meca<span class="logo-accent">Stock</span></span>
      </a>
    </div>

    <nav class="header-nav" id="main-nav">
      <button class="nav-item active" data-view="dashboard" onclick="navegarPara('dashboard')" id="nav-dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="inventario" onclick="navegarPara('inventario')" id="nav-inventario">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        Inventário
      </button>
      <button class="nav-item" data-view="veiculos" onclick="navegarPara('veiculos')" id="nav-veiculos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h.5l2-3h8l2 3H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2Z"/><circle cx="9" cy="13" r="2"/><circle cx="15" cy="13" r="2"/></svg>
        Veículos
      </button>
      <button class="nav-item" data-view="relatorios" onclick="navegarPara('relatorios')" id="nav-relatorios">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        Relatórios
      </button>
      <button class="nav-item" data-view="vendas" onclick="navegarPara('vendas')" id="nav-vendas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Vendas
      </button>
    </nav>

    <div class="header-right">
      <button class="notif-btn" id="notif-btn" onclick="alternarNotificacoes()" title="Alertas de estoque">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <!-- ===== NOTIFICATION PANEL ===== -->
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">
      <span>Alertas de Estoque Baixo</span>
      <button onclick="alternarNotificacoes()">✕</button>
    </div>
    <div class="notif-panel-body" id="notif-panel-body">
      <!-- JS rendered -->
    </div>
  </div>
  <div class="notif-overlay" id="notif-overlay" onclick="toggleNotifications()"></div>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <p class="sidebar-label">Menu Rápido</p>
        <button class="sidebar-item" onclick="abrirModalPeca()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Peça
        </button>
        <button class="sidebar-item" onclick="abrirModalVeiculo()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Veículo
        </button>
        <button class="sidebar-item" onclick="exportarCSV()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar CSV
        </button>
      </div>
      <div class="sidebar-section" id="sidebar-stats">
        <!-- JS rendered -->
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- JS renders views here -->
    </main>

  </div>

  <!-- ===== MODAL OVERLAY ===== -->
  <div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
    <div class="modal" id="modal-container">
      <!-- JS renders modal content -->
    </div>
  </div>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
